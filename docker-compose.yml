# Optional: runs the backend and the demo services. Ollama stays on the host.
services:
  backend:
    build: { context: ., dockerfile_inline: "FROM python:3.12-slim\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install -r requirements.txt\nCOPY backend backend\nWORKDIR /app/backend\nCMD uvicorn app.main:app --host 0.0.0.0 --port 8000" }
    ports: ["8000:8000"]
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      UPSTREAM_URL: http://127.0.0.1:9100
    extra_hosts: ["host.docker.internal:host-gateway"]
